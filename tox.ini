[tox]
envlist=py{310,311,312,313,314,py311},docs,linting
isolated_build = true

[testenv]
usedevelop=true
setenv =
    PYTHONWARNDEFAULTENCODING = 1
# the one list, from pyproject: a hand-maintained copy here drifted and
# left asyncssh/hypothesis out, so those modules failed to import
extras = testing
passenv = GITHUB_ACTIONS, HOME, USER, XDG_*, EXECNET_PROVISION_WHEEL
commands=
    python -m pytest {posargs:testing}

[testenv:docs]
skipsdist = True
usedevelop = True
# the doc examples are doctests and are run here, so this env needs what
# the suite needs as well as what sphinx needs
extras = testing
deps =
    sphinx
    PyYAML
commands =
    sphinx-build -W -b html doc doc/_build
    pytest --doctest-glob=*.rst doc

[testenv:linting]
skip_install = True
deps = pre-commit>=1.11.0
commands = pre-commit run --all-files --show-diff-on-failure

[pytest]
timeout = 20
addopts = -ra
testpaths = testing
