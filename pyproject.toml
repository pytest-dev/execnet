[build-system]
requires = [
    "hatchling>=1.26",
    "hatch-vcs",
]
build-backend = "hatchling.build"

[project]
name = "execnet"
dynamic = ["version"]
description = "execnet: rapid multi-Python deployment"
readme = {"file" = "README.rst", "content-type" = "text/x-rst"}
license = "MIT"
requires-python = ">=3.10"
# Nothing on Python 3.11+, where the asyncio engine runs the protocol.
# Below that there is no ``asyncio.TaskGroup`` and trio is the only engine,
# so it stays required there; 3.10 reaches end of life in October 2026 and
# this line goes with it.  ``execnet[trio]`` asks for trio anywhere, and it
# is preferred whenever it is installed -- see ``execnet._engine``.
dependencies = [
    "trio>=0.32; python_version < '3.11'",
]
authors = [
    { name = "holger krekel and others" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Distributed Computing",
    "Topic :: System :: Networking",
]

[project.scripts]
execnet = "execnet._cli:main"
# deprecated alias for `execnet server`
execnet-socketserver = "execnet._cli:socketserver_main"

[project.optional-dependencies]
gevent = [
    "gevent",
]
trio = [
    "trio>=0.32",
]
# what running the test suite needs -- tox installs exactly this, so there
# is one list rather than two that drift (asyncssh and hypothesis were
# missing from tox's own list, which failed collection in CI)
testing = [
    "pytest>8.0",
    "pytest-timeout",
    "hypothesis",
    "asyncssh",
    "uv",
    # the suite runs against both engines, so it needs trio on every Python
    "trio>=0.32",
]

[dependency-groups]
# the default group: everything a working checkout wants.  Keeping the
# test requirements here rather than in a separate non-default group means
# a plain `uv sync` can run the suite.
dev = [
    "execnet[testing]",
    "pytest-xdist>=3.8.0",
    "pre-commit",
    "tox",
    "hatch",
]
gevent = [
    "gevent>=26.7.0",
]

[project.urls]
Homepage = "https://execnet.readthedocs.io/en/latest/"

[tool.ruff.lint]
extend-select = [
    "B",    # bugbear
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "PYI",  # flake8-pyi
    "UP",   # pyupgrade
    "RUF",  # ruff
    "W",    # pycodestyle
    "PIE",  # flake8-pie
    "PGH",  # pygrep-hooks
    "PLE",  # pylint error
    "PLW",  # pylint warning
    "SIM",
]
ignore = [
    # bugbear ignore
    "B007",  # Loop control variable `i` not used within loop body
    "B011",  # Do not `assert False` (`python -O` removes these calls)
    # pycodestyle ignore
    "E501",  # Line too long
    "E741",  # Ambiguous variable name
    # ruff ignore
    "RUF012",  # Mutable class attributes should be annotated with `typing.ClassVar`
    "RUF061",  # Use context-manager form of `pytest.raises()`
    # pylint ignore
    "PLW0603",  # Using the global statement
    "PLW0120",  # remove the else and dedent its contents
    "PLW2901",  # for loop variable overwritten by assignment target
    "PLR5501",  # Use `elif` instead of `else` then `if`
    "UP031",  # Use format specifiers instead of percent format
    # flake8-simplify: overeager for this codebase
    "SIM105",  # try-except-pass -> suppress (bad with dynamic exc types / shutdown)
    "SIM115",  # open() without context manager (intentional long-lived handles)
]

[tool.ruff.lint.isort]
force-single-line = true
known-third-party = ["src"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/execnet/_version.py"

[tool.hatch.build.targets.sdist]
include = [
    "/doc",
    "/src",
    "/testing",
    "tox.ini",
]
[tool.mypy]
python_version = "3.10"
mypy_path = ["src"]
files = ["src", "testing"]
strict = true
warn_unreachable = true
warn_unused_ignores = false
disallow_untyped_calls = false
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = ["asyncssh.*"]
ignore_missing_imports = true
